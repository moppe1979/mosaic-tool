<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"></head><body><title>静止画モザイク修正</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c1f24;--card:#ffffff;--line:#d9dde3;--accent:#2563eb;--accent-fg:#ffffff;--muted:#5b6472;--bad:#e11d48;--soft:#eef2fb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#e8eaed;--card:#1e2126;--line:#33373e;--accent:#6b97f5;--accent-fg:#0b1020;--muted:#a0a7b2;--bad:#ff5c7c;--soft:#1b2232;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e8eaed;--card:#1e2126;--line:#33373e;--accent:#6b97f5;--accent-fg:#0b1020;--muted:#a0a7b2;--bad:#ff5c7c;--soft:#1b2232;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;padding-inline:16px;padding-block:14px 28px}
.app{max-width:1100px;margin:0 auto}
h1{font-size:18px;margin:0 0 10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.stage{position:sticky;top:14px}}
.stage{background:#000;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:160px}
.stage canvas{max-width:100%;max-height:68vh;display:block;touch-action:manipulation}
.stage canvas.pick{cursor:crosshair}
.empty{color:#9aa0a9;padding:48px 16px;text-align:center}
.panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details>summary{cursor:pointer;font-weight:700;padding:4px 0;min-height:32px}
label{display:block;margin:10px 0 2px;font-weight:600}
label.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:8px 0;min-height:32px}
small,.muted{color:var(--muted)}
input[type=range]{width:100%;margin:6px 0;height:28px}
input[type=file]{width:100%;font-size:15px}
input[type=checkbox]{width:20px;height:20px}
select{font:inherit;width:100%;min-height:42px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
button.on{outline:2px solid var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.row>*{flex:1 1 auto}
.sw{width:30px;height:30px;border-radius:6px;border:2px solid var(--line);cursor:pointer;flex:0 0 auto}
#status{min-height:1.6em}
.edits div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:2px 0}
.edits button{min-height:32px;padding:2px 10px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
</style>

<div class="app">
<h1>静止画モザイク修正</h1>
<div class="layout">
  <div class="stage" id="stage">
    <div class="empty" id="empty">画像を選ぶと、ここに表示されます。</div>
    <canvas id="cv" width="640" height="360" hidden></canvas>
  </div>

  <div class="panel">
    <div class="card">
      <input type="file" id="file" accept="image/*">
      <div id="status" class="muted" style="margin-top:6px">人物検出モデルを読み込み中…</div>
      <div class="row">
        <select id="fmt" style="max-width:130px"><option value="png">PNG</option><option value="jpg">JPEG</option></select>
        <button id="save" class="primary" disabled>保存</button>
      </div>
    </div>

    <details class="card" open>
      <summary>モザイクの方式</summary>
      <label class="chk"><input type="checkbox" id="mosaicOn" checked> モザイクをかける</label>
      <select id="mode">
        <option value="both" selected>ヘルメット色 + 人物から推定(漏れにくい)</option>
        <option value="helmet">ヘルメット色のみ</option>
        <option value="person">人物から推定のみ</option>
      </select>
      <div id="colorBox">
        <label>ヘルメット・帽子の色</label>
        <p class="hint">「色を選ぶ」→画像上のヘルメットをタップ。色の見本をタップすると削除。</p>
        <div class="row"><button id="pick" disabled>色を選ぶ</button><button id="clearColors">全部消す</button></div>
        <div class="row" id="sws" style="gap:6px"></div>
        <label>色の許容範囲 <small id="tolV"></small></label>
        <input type="range" id="tol" min="5" max="60" value="22">
      </div>
    </details>

    <details class="card" open>
      <summary>モザイクの修正</summary>
      <p class="hint">検出した人には、最初からモザイクがかかっています。<b>かけたくない人の円をタップ</b>すると解除され(赤い点線)、もう一度タップすると元に戻ります。検出されなかった人は「円を追加」→画像上をタップで追加できます(追加した円はタップで削除)。</p>
      <div class="row"><button id="addBtn" disabled>円を追加</button></div>
      <div class="edits" id="edits"></div>
    </details>

    <details class="card" open>
      <summary>見え方の設定</summary>
      <label>モザイクの細かさ <small id="blkV"></small></label>
      <input type="range" id="blk" min="4" max="60" value="40">
      <label>円の大きさ <small id="sizeV"></small></label>
      <input type="range" id="size" min="80" max="220" value="120">
      <label class="chk"><input type="checkbox" id="fit" checked> モザイクを人物の枠の中に収める</label>
      <label class="chk"><input type="checkbox" id="outline" checked> 円の枠を表示(保存した画像には入りません)</label>
      <label class="chk"><input type="checkbox" id="debug"> 検出枠を表示(緑=人物、橙=ヘルメット色)</label>
    </details>
    <p class="hint">画像は、この端末の中だけで処理され、外部には送信されません。保存した画像は、必ず目で見て、隠し漏れがないか確認してください。</p>
  </div>
</div>
</div>

<script src="libs/tf.min.js"></script>
<script src="libs/coco-ssd.min.js"></script>
<script>window.MODEL_CFG={base:'lite_mobilenet_v2',modelUrl:'models/model.json'};</script>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const base = document.createElement('canvas'), bctx = base.getContext('2d', {willReadFrequently: true});
let model = null, loaded = false, detecting = false, pending = false, fileName = 'image';
let heads = [], dbg = [], colors = [], exclusions = [], manuals = [], circles = [], picking = false, adding = false;
const MAX_SIDE = 4096;

const setStatus = t => $('status').textContent = t;
const bindVal = (id, out, f) => { const u = () => $(out).textContent = f($(id).value); $(id).addEventListener('input', u); u(); };
bindVal('blk', 'blkV', x => x + ' ブロック'); bindVal('size', 'sizeV', x => x + '%'); bindVal('tol', 'tolV', x => '色相±' + x);

cocoSsd.load(window.MODEL_CFG || {base: 'mobilenet_v2'}).then(m => {
  model = m; setStatus(loaded ? '検出中…' : '画像を選んでください。'); if (loaded) detect();
}).catch(e => setStatus('モデルの読み込みに失敗しました: ' + e.message));

// ---------- 色 ----------
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
  return {h, s: mx ? d / mx : 0, v: mx};
}
function matchColor(r, g, b) {
  const c = rgb2hsv(r, g, b), tol = +$('tol').value;
  for (const t of colors) {
    if (t.s < 0.2) { if (c.s < 0.25 && Math.abs(c.v - t.v) < 0.15) return true; }
    else {
      let dh = Math.abs(c.h - t.h); dh = Math.min(dh, 360 - dh);
      if (dh <= tol && Math.abs(c.s - t.s) < 0.4 && c.v > 0.25 && Math.abs(c.v - t.v) < 0.45) return true;
    }
  }
  return false;
}
function renderSw() {
  $('sws').innerHTML = '';
  colors.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'sw'; d.title = '削除';
    d.style.background = `rgb(${c.rgb.join(',')})`;
    d.onclick = () => { colors.splice(i, 1); renderSw(); detect(); };
    $('sws').appendChild(d);
  });
}
$('clearColors').onclick = () => { colors = []; renderSw(); detect(); };
$('pick').onclick = () => { picking = true; adding = false; $('addBtn').classList.remove('on'); cv.classList.add('pick'); setStatus('画像上のヘルメット(または帽子)をタップしてください。'); };

// ---------- 読み込み ----------
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  fileName = f.name.replace(/\.[^.]+$/, '');
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    let w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, MAX_SIDE / Math.max(w, h));
    base.width = cv.width = Math.round(w * s); base.height = cv.height = Math.round(h * s);
    bctx.drawImage(img, 0, 0, base.width, base.height);
    URL.revokeObjectURL(url);
    exclusions = []; manuals = []; heads = []; dbg = []; renderEdits();
    loaded = true; $('empty').hidden = true; cv.hidden = false;
    ['save', 'pick', 'addBtn'].forEach(i => $(i).disabled = false);
    setStatus(`読み込み完了(${base.width}×${base.height}${s < 1 ? '、大きいため縮小' : ''})`);
    redraw(); detect();
  };
  img.onerror = () => setStatus('この画像は開けませんでした。JPEG・PNG などを選んでください。');
  img.src = url;
};

// ---------- 検出 ----------
const sc = document.createElement('canvas'), sctx = sc.getContext('2d', {willReadFrequently: true});
function findHelmet(px, py, pw, ph) {
  const rx = Math.max(0, px - pw * 0.1), ry = Math.max(0, py - ph * 0.05);
  const rw = Math.min(base.width - rx, pw * 1.2), rh = Math.min(base.height - ry, ph * 0.38);
  if (rw < 8 || rh < 8) return null;
  const s = Math.min(1, 96 / rw), w = Math.max(1, Math.round(rw * s)), h = Math.max(1, Math.round(rh * s));
  sc.width = w; sc.height = h;
  sctx.drawImage(base, rx, ry, rw, rh, 0, 0, w, h);
  const d = sctx.getImageData(0, 0, w, h).data, mask = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) if (matchColor(d[i * 4], d[i * 4 + 1], d[i * 4 + 2])) mask[i] = 1;
  // 色が一致した領域のうち、最も大きい1つの塊だけを使う(背景の似た色を拾わないため)
  const seen = new Uint8Array(w * h); let best = null;
  for (let s = 0; s < w * h; s++) {
    if (!mask[s] || seen[s]) continue;
    const st = [s]; seen[s] = 1; let n = 0, x0 = w, x1 = 0, y0 = h, y1 = 0;
    while (st.length) {
      const p = st.pop(), px_ = p % w, py_ = (p / w) | 0; n++;
      if (px_ < x0) x0 = px_; if (px_ > x1) x1 = px_; if (py_ < y0) y0 = py_; if (py_ > y1) y1 = py_;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = px_ + dx, ny = py_ + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const q = ny * w + nx; if (mask[q] && !seen[q]) { seen[q] = 1; st.push(q); }
      }
    }
    if (!best || n > best.n) best = {n, x0, x1, y0, y1};
  }
  if (!best || best.n < Math.max(6, w * h * 0.01)) return null;
  const x0 = best.x0, x1 = best.x1, y0 = best.y0, y1 = best.y1;
  return {x: rx + x0 / s, y: ry + y0 / s, w: (x1 - x0 + 1) / s, h: (y1 - y0 + 1) / s};
}
async function detect() {
  if (!model || !loaded) return;
  if (detecting) { pending = true; return; }
  detecting = true;
  try {
    const mode = $('mode').value, size = $('size').value / 100;
    const preds = await model.detect(base, 20, 0.25);
    const nh = [], nd = [];
    for (const p of preds) {
      if (p.class !== 'person') continue;
      const [x, y, w, h] = p.bbox;
      nd.push({type: 'person', r: [x, y, w, h]});
      const hm = (mode !== 'person' && colors.length) ? findHelmet(x, y, w, h) : null;
      if (hm) {
        nd.push({type: 'helmet', r: [hm.x, hm.y, hm.w, hm.h]});
        const hw = Math.max(hm.w, hm.h * 0.9);
        nh.push({cx: hm.x + hm.w / 2, cy: hm.y + hw * 0.7, r: hw * 0.6 * size, box: [x, y, w, h]});
      } else if (mode === 'person' || mode === 'both') {
        const hh = Math.max(h * 0.27, w * 0.45);
        nh.push({cx: x + w / 2, cy: y + hh * 0.45, r: Math.max(hh * 0.65, w * 0.35) * size, box: [x, y, w, h]});
      }
    }
    heads = nh; dbg = nd;
    setStatus(nh.length ? `検出した ${nh.length} 人の頭部にモザイクをかけました。かけたくない人は、円をタップして解除してください。` : '人物が検出されませんでした。「円を追加」で手動で追加できます。');
  } catch (e) { console.error(e); setStatus('検出に失敗しました: ' + e.message); }
  detecting = false;
  redraw();
  if (pending) { pending = false; detect(); }
}
['mode', 'size', 'tol'].forEach(i => $(i).addEventListener('change', detect));
$('mode').addEventListener('change', () => { $('colorBox').hidden = $('mode').value === 'person'; });

// ---------- 修正 ----------
const near = (a, e) => Math.hypot(a.cx - e.cx, a.cy - e.cy) < Math.max(a.r, e.r);
function renderEdits() {
  const box = $('edits'); box.innerHTML = '';
  const add = (label, fn) => { const d = document.createElement('div'); d.innerHTML = '<span></span>'; d.firstChild.textContent = label; const b = document.createElement('button'); b.textContent = '削除'; b.onclick = fn; d.appendChild(b); box.appendChild(d); };
  exclusions.forEach((e, i) => add('除外した円 ' + (i + 1), () => { exclusions.splice(i, 1); renderEdits(); redraw(); }));
  manuals.forEach((e, i) => add('追加した円 ' + (i + 1), () => { manuals.splice(i, 1); renderEdits(); redraw(); }));
}
$('addBtn').onclick = () => { adding = !adding; picking = false; cv.classList.toggle('pick', adding); $('addBtn').classList.toggle('on', adding); if (adding) setStatus('画像上をタップすると、その位置に円を追加します。'); };
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
  if (picking) {
    redraw(false);
    const R = Math.max(2, Math.round(cv.width / 400)), p = bctx.getImageData(Math.max(0, Math.round(x) - R), Math.max(0, Math.round(y) - R), R * 2 + 1, R * 2 + 1).data;
    let sr = 0, sg = 0, sb = 0; const n = p.length / 4;
    for (let i = 0; i < p.length; i += 4) { sr += p[i]; sg += p[i + 1]; sb += p[i + 2]; }
    const rgb = [Math.round(sr / n), Math.round(sg / n), Math.round(sb / n)];
    colors.push({...rgb2hsv(...rgb), rgb});
    picking = false; cv.classList.remove('pick'); renderSw(); setStatus('色を登録しました(' + colors.length + '色)。'); detect(); return;
  }
  const hit = circles.filter(c => Math.hypot(c.cx - x, c.cy - y) <= c.r).sort((a, b) => a.r - b.r)[0];
  if (hit && hit.manual) { manuals.splice(manuals.indexOf(hit.manual), 1); renderEdits(); redraw(); setStatus('追加した円を削除しました。'); return; }
  if (adding) {
    const avg = heads.length ? heads.reduce((s, h) => s + h.r, 0) / heads.length : cv.width * 0.06;
    manuals.push({cx: x, cy: y, r: avg}); renderEdits(); redraw(); setStatus('円を追加しました。'); return;
  }
  if (!hit) return;
  if (hit.off) { exclusions = exclusions.filter(e => !near(hit, e)); setStatus('この円のモザイクをONに戻しました。'); }
  else { exclusions.push({cx: hit.cx, cy: hit.cy, r: hit.r}); setStatus('この円のモザイクをOFFにしました。'); }
  renderEdits(); redraw();
});

// ---------- 描画 ----------
const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
function pixelate(b) {
  const W = cv.width, H = cv.height;
  const x = Math.max(0, Math.floor(b.cx - b.r)), y = Math.max(0, Math.floor(b.cy - b.r));
  const w = Math.min(W - x, Math.ceil(b.r * 2)), h = Math.min(H - y, Math.ceil(b.r * 2));
  if (w < 2 || h < 2) return;
  const n = +$('blk').value;
  const bw = Math.max(1, Math.round(n * w / (b.r * 2))), bh = Math.max(1, Math.round(n * h / (b.r * 2)));
  tmp.width = bw; tmp.height = bh;
  tctx.imageSmoothingEnabled = true;
  tctx.drawImage(base, x, y, w, h, 0, 0, bw, bh);
  ctx.save();
  ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2); ctx.clip();
  if ($('fit').checked && b.box) { ctx.beginPath(); ctx.rect(b.box[0], b.box[1], b.box[2], b.box[3]); ctx.clip(); }   // 人物の枠の外へはみ出さない
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmp, 0, 0, bw, bh, x, y, w, h);
  ctx.restore();
}
function redraw(overlay = true) {
  if (!loaded) return;
  ctx.drawImage(base, 0, 0);
  circles = [];
  if ($('mosaicOn').checked) {
    circles = heads.map(h => ({...h, off: exclusions.some(e => near(h, e))}));
    manuals.forEach(m => circles.push({cx: m.cx, cy: m.cy, r: m.r, off: false, manual: m}));
    circles.forEach(c => { if (!c.off) pixelate(c); });
    if (overlay) {
      ctx.lineWidth = Math.max(2, cv.width / 500);
      if ($('debug').checked) dbg.forEach(d => { ctx.strokeStyle = d.type === 'person' ? 'lime' : 'orange'; ctx.setLineDash([]); ctx.strokeRect(...d.r); });
      if ($('outline').checked) circles.forEach(c => {
        ctx.beginPath(); ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2);
        ctx.strokeStyle = c.off ? '#e11d48' : 'rgba(255,255,255,.85)';
        ctx.setLineDash(c.off ? [cv.width / 90, cv.width / 110] : []); ctx.stroke(); ctx.setLineDash([]);
      });
    }
  }
}
['blk', 'size', 'mosaicOn', 'fit', 'outline', 'debug'].forEach(i => $(i).addEventListener('input', () => redraw()));
$('size').addEventListener('input', () => { /* 円の大きさは検出し直して反映(changeで実行) */ });

// ---------- 保存 ----------
async function saveBlob(blob, name) {
  const file = new File([blob], name, {type: blob.type});
  // スマホ: 共有シート(「写真に保存」「ファイルに保存」などを選べる)
  if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); return 'saved'; }
    catch (e) { if (e && e.name === 'AbortError') return 'declined'; }
  }
  // PC(Chrome / Edge): 保存先を選ぶ
  if (window.showSaveFilePicker) {
    try {
      const ext = name.split('.').pop();
      const h = await window.showSaveFilePicker({suggestedName: name, types: [{description: 'ファイル', accept: {[blob.type || 'application/octet-stream']: ['.' + ext]}}]});
      const w = await h.createWritable(); await w.write(blob); await w.close(); return 'saved';
    } catch (e) { if (e && e.name === 'AbortError') return 'declined'; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 20000);
  return 'saved';
}
$('save').onclick = async () => {
  if (!loaded) return;
  const jpg = $('fmt').value === 'jpg', ext = jpg ? 'jpg' : 'png';
  redraw(false);   // 枠を描かない状態で書き出す
  const blob = await new Promise(r => cv.toBlob(r, jpg ? 'image/jpeg' : 'image/png', 0.92));
  redraw(true);
  if (!blob) { setStatus('保存用の画像を作れませんでした。'); return; }
  const res = await saveBlob(blob, `${fileName}_モザイク.${ext}`);
  setStatus(res === 'saved' ? '保存しました。必ず目で見て、隠し漏れがないか確認してください。' : '保存をキャンセルしました。');
};
</script>
</body></html>
