<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#2563eb"></head><body><title>動画モザイク スマホ版</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c1f24;--card:#ffffff;--line:#d9dde3;--accent:#2563eb;--accent-fg:#ffffff;--muted:#5b6472;--bad:#e11d48;--shade:rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--fg:#e8eaed;--card:#1e2126;--line:#33373e;--accent:#6b97f5;--accent-fg:#0b1020;--muted:#a0a7b2;--bad:#ff5c7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--fg:#e8eaed;--card:#1e2126;--line:#33373e;--accent:#6b97f5;--accent-fg:#0b1020;--muted:#a0a7b2;--bad:#ff5c7c;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;overflow:hidden}
/* 1画面に収める: 上からプレビュー(残りの高さを使う)・操作アイコン・トリミング・書き出し */
.app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:max(8px,env(safe-area-inset-top,0px)) 10px max(8px,env(safe-area-inset-bottom,0px))}
.stage{flex:1 1 auto;min-height:0;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage canvas{max-width:100%;max-height:100%;display:block;touch-action:manipulation}
.stage canvas.pick{cursor:crosshair}
video{display:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
svg .f{fill:currentColor;stroke:none}
.tools{display:flex;gap:5px}
.tool{flex:1 1 0;min-width:0;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:10px;line-height:1.2;cursor:pointer}
.tool.on{outline:2px solid var(--accent)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play .i-pause{display:none}
#play.playing .i-play{display:none}
#play.playing .i-pause{display:block}
.info{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.tb{position:relative;height:38px;cursor:pointer;flex:0 0 auto}
.tb .track{position:absolute;left:0;right:0;top:15px;height:8px;background:var(--line);border-radius:4px}
.tb .fill{position:absolute;top:15px;height:8px;background:var(--accent);border-radius:4px}
.tb .ph{position:absolute;top:3px;width:3px;height:32px;background:var(--bad);pointer-events:none}
.tb input{position:absolute;left:0;top:0;width:100%;height:38px;margin:0;pointer-events:none;-webkit-appearance:none;appearance:none;background:transparent}
.tb input::-webkit-slider-runnable-track{background:transparent}
.tb input::-moz-range-track{background:transparent}
.tb input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;appearance:none;width:24px;height:36px;border-radius:8px;background:var(--accent);border:3px solid #fff;cursor:ew-resize}
.tb input::-moz-range-thumb{pointer-events:auto;width:18px;height:30px;border-radius:8px;background:var(--accent);border:3px solid #fff;cursor:ew-resize}
.dock{display:flex;flex-direction:column;gap:4px}
.dock .row{display:flex;gap:6px;align-items:stretch}
.dock .row .tool{flex-direction:row;gap:6px;font-size:14px;font-weight:700;min-height:46px}
.dock .row .tool.wide{flex:3 1 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
#status{font-size:12px;line-height:1.35;color:var(--muted);min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 設定シート */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.sheet[hidden],.shade[hidden]{display:none}
.sheet h2{font-size:17px;margin:0}
.sheet .head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-12px;background:var(--bg);padding:2px 0 8px;margin-bottom:4px}
.iconbtn{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:10px}
.group h3{font-size:13px;margin:0 0 2px;color:var(--muted);font-weight:700}
label{display:block;margin:10px 0 2px;font-weight:600;font-size:14px}
label.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:4px 0;min-height:40px}
input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
input[type=range]{width:100%;margin:4px 0;height:30px}
select{font:inherit;width:100%;min-height:44px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
small,.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.btn{font:inherit;min-height:42px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sw{width:32px;height:32px;border-radius:7px;border:2px solid var(--line);cursor:pointer;flex:0 0 auto}
.edits div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:2px 0;font-size:13px}
.edits button{min-height:32px;padding:2px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.stage{position:relative;touch-action:none}
.stage canvas{transform-origin:50% 50%}
.zoomctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoomctl button{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
</style>
<div class="app">
  <div class="stage"><canvas id="cv" width="360" height="640"></canvas><div class="zoomctl">
      <button id="zoomIn" aria-label="拡大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomOut" aria-label="縮小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button id="zoomReset" aria-label="拡大をもとに戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div></div>
  <video id="v" playsinline muted></video>
  <input type="file" id="file" accept="video/*" class="vh">

  <div class="tools">
    <label class="tool" for="file" id="openLbl" title="動画を開く" role="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>開く
    </label>
    <button class="tool" id="play" disabled aria-label="再生・一時停止">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>再生
    </button>
    <button class="tool" id="toStart" disabled aria-label="開始位置を今の位置にする">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 12h11M14 8l4 4-4 4"/></svg>開始
    </button>
    <button class="tool" id="toEnd" disabled aria-label="終了位置を今の位置にする">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4v16M17 12H6M10 8l-4 4 4 4"/></svg>終了
    </button>
    <button class="tool" id="pick" disabled aria-label="ヘルメットの色を選ぶ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 5.6l-2.3-2.3a1 1 0 0 0-1.4 0L14 6.3l-1-1-1.4 1.4 1 1L5 15.3V19h3.7l7.6-7.6 1 1 1.4-1.4-1-1 3-3a1 1 0 0 0 0-1.4z"/></svg>色
    </button>
    <button class="tool" id="addBtn" disabled aria-label="モザイクの円を追加">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>円追加
    </button>
    <button class="tool" id="settingsBtn" aria-label="設定を開く">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg>設定
    </button>
  </div>

  <div>
    <div class="tb" id="tb">
      <div class="track"></div><div class="fill" id="fill"></div><div class="ph" id="ph"></div>
      <input type="range" id="tStart" min="0" max="1000" value="0" step="1" aria-label="開始位置">
      <input type="range" id="tEnd" min="0" max="1000" value="1000" step="1" aria-label="終了位置">
    </div>
    <div class="info"><span id="time">0.0 / 0.0 秒</span><span id="trimInfo">開始 0.0 / 終了 0.0(長さ 0.0 秒)</span></div>
  </div>

  <div class="dock">
    <div class="row">
      <button class="tool primary wide" id="export" disabled aria-label="書き出す">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>書き出し
      </button>
      <button class="tool" id="saveVideo" hidden aria-label="保存する">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg>保存
      </button>
      <button class="tool" id="stop" disabled aria-label="中止">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="6" y="6" width="12" height="12" rx="2"/></svg>中止
      </button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div id="status">人物検出モデルを読み込み中…</div>
  </div>
</div>

<div class="shade" id="shade" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="設定">
  <div class="head"><h2>設定</h2><button class="iconbtn" id="closeSheet" aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

  <div class="group">
    <h3>オン・オフ</h3>
    <label class="chk"><input type="checkbox" id="mosaicOn" checked> モザイクをかける</label>
    <label class="chk"><input type="checkbox" id="fit" checked> モザイクを人物の枠の中に収める</label>
    <label class="chk"><input type="checkbox" id="outline" checked> 円の枠を表示(書き出しには入りません)</label>
    <label class="chk"><input type="checkbox" id="debug"> 検出枠を表示(緑=人物、橙=ヘルメット色)</label>
  </div>

  <div class="group">
    <h3>モザイクの方式</h3>
    <select id="mode">
      <option value="both" selected>ヘルメット色 + 人物から推定(漏れにくい)</option>
      <option value="helmet">ヘルメット色のみ</option>
      <option value="person">人物から推定のみ</option>
    </select>
    <div id="colorBox">
      <p class="hint">色は、画面の「色」ボタン→動画上のヘルメットをタップで登録します。見本をタップすると削除。</p>
      <div class="row2" id="sws" style="gap:6px"></div>
      <div class="row2"><button class="btn" id="clearColors">色を全部消す</button></div>
      <label>色の許容範囲 <small id="tolV"></small></label>
      <input type="range" id="tol" min="5" max="60" value="22">
    </div>
  </div>

  <div class="group">
    <h3>モザイクの修正</h3>
    <p class="hint">円をタップ=ON/OFF(白枠=あり、赤い点線=なし)。「円追加」を押して動画上をタップすると追加、円をタップで削除。</p>
    <label>修正の適用範囲</label>
    <select id="scope">
      <option value="seg">この検出区間だけ</option>
      <option value="after" selected>ここから最後まで</option>
      <option value="all">動画全体</option>
    </select>
    <div class="edits" id="edits"></div>
  </div>

  <div class="group">
    <h3>見え方</h3>
    <label>モザイクの細かさ <small id="blkV"></small></label>
    <input type="range" id="blk" min="4" max="40" value="40">
    <label>円の大きさ <small id="sizeV"></small></label>
    <input type="range" id="size" min="80" max="220" value="120">
    <label>円を人物の枠の内側へずらす <small id="insetV"></small></label>
    <input type="range" id="inset" min="0" max="30" value="10">
    <label>検出の間隔 <small id="stepV"></small></label>
    <input type="range" id="step" min="1" max="60" value="10">
    <p class="hint">スマホは処理が重いため、間隔は10フレームを標準にしています。書き出しは、再生と同じ速さで進みます。</p>
  </div>
</div>

<script>
// 診断: 動かないときに、原因が画面に出るようにする
(function () {
  const st = () => document.getElementById('status');
  const show = m => {
    let t = String(m || '不明なエラー');
    if (/cocoSsd|\btf\b|tensorflow/i.test(t)) t = 'ライブラリを読み込めませんでした。通信状況を確認して、ページを再読み込みしてください。(' + t + ')';
    const s = st(); if (s) s.textContent = 'エラー: ' + t;
  };
  window.addEventListener('error', e => show(e && e.message));
  window.addEventListener('unhandledrejection', e => show(e && e.reason && (e.reason.message || e.reason)));
  // モデルの読み込みが遅いとき
  setTimeout(() => { const s = st(); if (s && /読み込み中/.test(s.textContent)) s.textContent += '(時間がかかっています。Wi-Fiなど、通信の良い場所でお試しください)'; }, 15000);
  // アプリ内ブラウザ(LINE・Instagram など)では、ファイル選択や保存が動かないことがある
  if (/Line\/|FBAN|FBAV|Instagram|MicroMessenger|Twitter|KAKAOTALK|; wv\)/i.test(navigator.userAgent)) {
    document.addEventListener('DOMContentLoaded', () => {
      const b = document.createElement('div');
      b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#b45309;color:#fff;padding:10px 14px;font:14px/1.5 system-ui,sans-serif;cursor:pointer';
      b.textContent = 'アプリ内ブラウザでは動かないことがあります。メニューから「ブラウザで開く」を選ぶか、Chrome / Safari でこのURLを開いてください。(タップで閉じる)';
      b.onclick = () => b.remove();
      document.body.appendChild(b);
    });
  }
})();
</script>
<script src="libs/tf.min.js"></script>
<script src="libs/coco-ssd.min.js"></script>
<script>window.MODEL_CFG={base:'lite_mobilenet_v2',modelUrl:'models/model.json'};</script>
<script>
const $ = id => document.getElementById(id);
const v = $('v'), cv = $('cv'), ctx = cv.getContext('2d');
let model = null, heads = [], dbg = [], lastDet = -1e9, detecting = false, exporting = false;
let exportStream = null, exportCapture = null, exportStart = 0, exportEnd = 0, exportPlaying = false, picking = false, adding = false, duration = 0, recorder = null, chunks = [];
let lastOut = null, colors = [], exclusions = [], manuals = [], circles = [];

const setStatus = t => $('status').textContent = t;
const fmt = s => s.toFixed(1);
const stepSec = () => $('step').value / 30;

setStatus('人物検出モデルを読み込み中…');
cocoSsd.load(window.MODEL_CFG || {base: 'mobilenet_v2'}).then(m => { model = m; setStatus('モデル準備完了。動画を選択してください。'); })
  .catch(e => setStatus('モデルの読み込みに失敗しました: ' + e.message));

const bindVal = (id, out, f) => { const u = () => $(out).textContent = f($(id).value); $(id).addEventListener('input', u); u(); };
bindVal('blk', 'blkV', x => x + ' ブロック'); bindVal('size', 'sizeV', x => x + '%'); bindVal('inset', 'insetV', x => x + '%');
bindVal('step', 'stepV', x => x + ' フレーム'); bindVal('tol', 'tolV', x => '色相±' + x);
['size', 'tol', 'mode', 'inset'].forEach(i => $(i).addEventListener('change', () => { lastDet = -1e9; }));
$('mode').addEventListener('change', () => { $('colorBox').style.display = $('mode').value === 'person' ? 'none' : ''; });
$('mosaicOn').addEventListener('change', () => { lastDet = -1e9; });

// ---------- 色 ----------
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
  return {h, s: mx ? d / mx : 0, v: mx};
}
function renderSw() {
  $('sws').innerHTML = '';
  colors.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'sw'; d.title = 'クリックで削除';
    d.style.background = `rgb(${c.rgb.join(',')})`;
    d.onclick = () => { colors.splice(i, 1); renderSw(); lastDet = -1e9; };
    $('sws').appendChild(d);
  });
}
$('clearColors').onclick = () => { colors = []; renderSw(); lastDet = -1e9; };
$('pick').onclick = () => { picking = true; adding = false; $('addBtn').classList.remove('on'); cv.classList.add('pick'); setStatus('動画上のヘルメット(または帽子)をクリックしてください。'); };
function matchColor(r, g, b) {
  const c = rgb2hsv(r, g, b), tol = +$('tol').value;
  for (const t of colors) {
    if (t.s < 0.2) { if (c.s < 0.25 && Math.abs(c.v - t.v) < 0.15) return true; }
    else {
      let dh = Math.abs(c.h - t.h); dh = Math.min(dh, 360 - dh);
      if (dh <= tol && Math.abs(c.s - t.s) < 0.4 && c.v > 0.25 && Math.abs(c.v - t.v) < 0.45) return true;
    }
  }
  return false;
}

// ---------- 読み込み ----------
$('file').onchange = e => { const f = e.target.files[0]; if (f) { v.src = URL.createObjectURL(f); exclusions = []; manuals = []; renderEdits(); } };
v.onloadedmetadata = () => {
  duration = v.duration;
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  $('tStart').value = 0; $('tEnd').value = 1000;
  ['play', 'export', 'toStart', 'toEnd', 'pick', 'addBtn'].forEach(i => $(i).disabled = false);
  heads = []; dbg = []; lastDet = -1e9; v.currentTime = 0;
  updateTrim(); setStatus('読み込み完了(' + v.videoWidth + '×' + v.videoHeight + ', ' + fmt(duration) + '秒)');
};
const onSeeked = () => { lastDet = -1e9; draw(); };
v.onseeked = onSeeked;

// ---------- トリミング(1本バー) ----------
const tS = () => $('tStart').value / 1000 * duration;
const tE = () => $('tEnd').value / 1000 * duration;
function layoutBar() {
  const a = $('tStart').value / 1000, b = $('tEnd').value / 1000, p = duration ? v.currentTime / duration : 0;
  const pos = q => `calc(${q * 100}% + ${8 - 16 * q}px)`;
  $('fill').style.left = pos(a); $('fill').style.width = `calc(${(b - a) * 100}% - ${16 * (b - a)}px)`;
  $('ph').style.left = pos(Math.min(1, Math.max(0, p)));
}
function updateTrim(src) {
  const s = $('tStart'), e = $('tEnd');
  if (+s.value > +e.value - 1) { if (src === 'e') e.value = +s.value + 1; else s.value = +e.value - 1; }
  $('trimInfo').textContent = `開始 ${fmt(tS())} / 終了 ${fmt(tE())}(長さ ${fmt(tE() - tS())}秒)`;
  layoutBar();
}
$('tStart').oninput = () => { updateTrim('s'); v.currentTime = tS(); };
$('tEnd').oninput = () => { updateTrim('e'); v.currentTime = Math.max(0, tE() - 0.05); };
$('tb').addEventListener('click', e => {
  if (e.target.tagName === 'INPUT' || !duration) return;
  const r = $('tb').getBoundingClientRect();
  v.currentTime = Math.min(duration, Math.max(0, (e.clientX - r.left - 8) / (r.width - 16) * duration));
});
$('toStart').onclick = () => { $('tStart').value = v.currentTime / duration * 1000; updateTrim('s'); };
$('toEnd').onclick = () => { $('tEnd').value = v.currentTime / duration * 1000; updateTrim('e'); };
$('play').onclick = () => {

// ---------- 検出 ----------
const sc = document.createElement('canvas'), sctx = sc.getContext('2d', {willReadFrequently: true});
function findHelmet(px, py, pw, ph) {
  const rx = Math.max(0, px - pw * 0.1), ry = Math.max(0, py - ph * 0.05);
  const rw = Math.min(cv.width - rx, pw * 1.2), rh = Math.min(cv.height - ry, ph * 0.38);
  if (rw < 8 || rh < 8) return null;
  const s = Math.min(1, 96 / rw), w = Math.max(1, Math.round(rw * s)), h = Math.max(1, Math.round(rh * s));

  const d = sctx.getImageData(0, 0, w, h).data, mask = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) if (matchColor(d[i * 4], d[i * 4 + 1], d[i * 4 + 2])) mask[i] = 1;
  // 色が一致した領域のうち、最も大きい1つの塊だけを使う(背景の似た色を拾わないため)
  const seen = new Uint8Array(w * h); let best = null;
  for (let s = 0; s < w * h; s++) {
    if (!mask[s] || seen[s]) continue;
    const st = [s]; seen[s] = 1; let n = 0, x0 = w, x1 = 0, y0 = h, y1 = 0;
    while (st.length) {
      const p = st.pop(), px_ = p % w, py_ = (p / w) | 0; n++;
      if (px_ < x0) x0 = px_; if (px_ > x1) x1 = px_; if (py_ < y0) y0 = py_; if (py_ > y1) y1 = py_;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = px_ + dx, ny = py_ + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const q = ny * w + nx; if (mask[q] && !seen[q]) { seen[q] = 1; st.push(q); }
      }
    }
    if (!best || n > best.n) best = {n, x0, x1, y0, y1};
  }
  if (!best || best.n < Math.max(6, w * h * 0.01)) return null;
  const x0 = best.x0, x1 = best.x1, y0 = best.y0, y1 = best.y1;
  return {x: rx + x0 / s, y: ry + y0 / s, w: (x1 - x0 + 1) / s, h: (y1 - y0 + 1) / s};
}
// 円の位置を、人物の枠の中心側へ、枠の大きさの「内側へずらす」%だけ動かす(0〜30%)
function withInset(c) {
  const k = ($('inset') ? +$('inset').value : 0) / 100;
  if (!c.box || !k) return c;
  const [bx, by, bw, bh] = c.box;
  const mv = (v, mid, size) => { const d = mid - v; return v + Math.sign(d) * Math.min(Math.abs(d), k * size); };
  c.cx = mv(c.cx, bx + bw / 2, bw); c.cy = mv(c.cy, by + bh / 2, bh);

}
async function detect() {
  if (!model || detecting) return;
  detecting = true;
  const t = v.currentTime, mode = $('mode').value;
  try {
    const preds = await model.detect(v, 60, 0.3);
    const size = $('size').value / 100, nh = [], nd = [];
    // 集団を1人と誤検出した大きな枠(中に、小さな人物の枠が2つ以上入っているもの)を除く
    let persons = preds.filter(p => p.class === 'person' && p.bbox[2] * p.bbox[3] > 0);
    persons = persons.filter(p => {
      const [x, y, w, h] = p.bbox; let inside = 0;
      for (const q of persons) {
        if (q === p) continue;
        const [qx, qy, qw, qh] = q.bbox;
        const ix = Math.max(0, Math.min(x + w, qx + qw) - Math.max(x, qx)), iy = Math.max(0, Math.min(y + h, qy + qh) - Math.max(y, qy));
        if (ix * iy >= 0.7 * qw * qh && qw * qh < 0.5 * w * h) inside++;
      }
      return inside < 2;
    });
    for (const p of persons) {
      const [x, y, w, h] = p.bbox;
      nd.push({type: 'person', r: [x, y, w, h]});
      const hm = (mode !== 'person' && colors.length) ? findHelmet(x, y, w, h) : null;
      if (hm) {
        nd.push({type: 'helmet', r: [hm.x, hm.y, hm.w, hm.h]});
        const hw = Math.max(hm.w, hm.h * 0.9);
        nh.push(withInset({cx: hm.x + hm.w / 2, cy: hm.y + hw * 0.7, r: hw * 0.6 * size, box: [x, y, w, h]}));
      } else if (mode === 'person' || mode === 'both') {
        const hh = Math.max(h * 0.27, w * 0.45);
        nh.push(withInset({cx: x + w / 2, cy: y + hh * 0.45, r: Math.max(hh * 0.65, w * 0.35) * size, box: [x, y, w, h]}));
      }
    }

  } catch (e) { console.error(e); }
  detecting = false;
}

// ---------- 修正(ON/OFF・追加) ----------
function scopeRange() {
  const t = v.currentTime, from = lastDet > -1e8 ? lastDet : t, s = $('scope').value;
  if (s === 'seg') return [from, from + stepSec() - 1e-3];
  if (s === 'after') return [from, Infinity];
  return [0, Infinity];
}
// 円の同一判定: 中心が近く、大きさも近いものだけを「同じ円」とみなす(大きな円が、周りの小さな円まで巻き込まないように)
const near = (a, e) => {
  const lo = Math.min(a.r, e.r), hi = Math.max(a.r, e.r);
  return hi / Math.max(1, lo) <= 2.5 && Math.hypot(a.cx - e.cx, a.cy - e.cy) < 0.6 * lo;
};
const inRange = (e, t) => t >= e.from - 1e-6 && t <= e.to;
function renderEdits() {
  const box = $('edits'); box.innerHTML = '';
  const rng = e => `${fmt(Math.max(0, e.from))}〜${e.to === Infinity ? '最後' : fmt(e.to)}秒`;
  exclusions.forEach((e, i) => { const d = document.createElement('div'); d.innerHTML = `<span>除外 ${rng(e)}</span>`; const b = document.createElement('button'); b.textContent = '削除'; b.onclick = () => { exclusions.splice(i, 1); renderEdits(); }; d.appendChild(b); box.appendChild(d); });
  manuals.forEach((e, i) => { const d = document.createElement('div'); d.innerHTML = `<span>追加 ${rng(e)}</span>`; const b = document.createElement('button'); b.textContent = '削除'; b.onclick = () => { manuals.splice(i, 1); renderEdits(); }; d.appendChild(b); box.appendChild(d); });
}
$('addBtn').onclick = () => { adding = !adding; picking = false; cv.classList.toggle('pick', adding); $('addBtn').classList.toggle('on', adding); if (adding) setStatus('動画上をクリックすると、その位置に円を追加します。'); };
cv.onclick = e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * cv.width / r.width, y = (e.clientY - r.top) * cv.height / r.height;
  if (picking) {
    const R = 3, p = ctx.getImageData(Math.max(0, Math.round(x) - R), Math.max(0, Math.round(y) - R), R * 2 + 1, R * 2 + 1).data;
    let sr = 0, sg = 0, sb = 0; const n = p.length / 4;
    for (let i = 0; i < p.length; i += 4) { sr += p[i]; sg += p[i + 1]; sb += p[i + 2]; }
    const rgb = [Math.round(sr / n), Math.round(sg / n), Math.round(sb / n)];
    colors.push({...rgb2hsv(...rgb), rgb});
    picking = false; cv.classList.remove('pick'); renderSw(); lastDet = -1e9;
    setStatus('色を登録しました(' + colors.length + '色)。'); return;
  }

  if (adding) {
    if (hit && hit.manual) { manuals.splice(manuals.indexOf(hit.manual), 1); renderEdits(); setStatus('追加した円を削除しました。'); return; }

    const [from, to] = scopeRange();

  }
  if (!hit) return;
  if (hit.manual) { manuals.splice(manuals.indexOf(hit.manual), 1); renderEdits(); setStatus('追加した円を削除しました。'); return; }

  if (hit.off) { exclusions = exclusions.filter(e => !(inRange(e, t) && near(hit, e))); setStatus('この円のモザイクをONに戻しました。'); }
  else { const [from, to] = scopeRange(); exclusions.push({cx: hit.cx, cy: hit.cy, r: hit.r, from, to}); setStatus('この円のモザイクをOFFにしました。'); }

// ---------- 描画 ----------
const tmp = document.createElement('canvas'), tctx = tmp.getContext('2d');
function pixelate(b) {
  const W = cv.width, H = cv.height;
  const x = Math.max(0, Math.floor(b.cx - b.r)), y = Math.max(0, Math.floor(b.cy - b.r));
  const w = Math.min(W - x, Math.ceil(b.r * 2)), h = Math.min(H - y, Math.ceil(b.r * 2));
  if (w < 2 || h < 2) return;
  const n = +$('blk').value;
  const bw = Math.max(1, Math.round(n * w / (b.r * 2))), bh = Math.max(1, Math.round(n * h / (b.r * 2)));
  tmp.width = bw; tmp.height = bh;
  tctx.imageSmoothingEnabled = true;
  tctx.drawImage(cv, x, y, w, h, 0, 0, bw, bh);
  ctx.save();
  ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2); ctx.clip();
  if ($('fit').checked && b.box) { ctx.beginPath(); ctx.rect(b.box[0], b.box[1], b.box[2], b.box[3]); ctx.clip(); }   // 人物の枠の外へはみ出さない
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmp, 0, 0, bw, bh, x, y, w, h);
  ctx.restore();
}
function draw() {
  if (!duration) return;
  ctx.drawImage(v, 0, 0, cv.width, cv.height);
  const t = v.currentTime;
  circles = [];
  if ($('mosaicOn').checked) {
    if ((lastDet < 0 || Math.abs(t - lastDet) >= stepSec()) && !(exporting && exportPlaying && t > exportEnd - 1.5)) detect();   // 終了間際は、重い検出を始めない(終了判定が遅れないように)
    circles = heads.map(h => ({...h, off: exclusions.some(e => inRange(e, t) && near(h, e))}));
    manuals.filter(m => inRange(m, t)).forEach(m => circles.push({cx: m.cx, cy: m.cy, r: m.r, off: false, manual: m}));
    circles.forEach(c => { if (!c.off) pixelate(c); });

      ctx.lineWidth = Math.max(2, cv.width / 400);
      if ($('debug').checked) dbg.forEach(d => { ctx.strokeStyle = d.type === 'person' ? 'lime' : 'orange'; ctx.setLineDash([]); ctx.strokeRect(...d.r); });

        ctx.strokeStyle = c.off ? '#e11d48' : 'rgba(255,255,255,.8)'; ctx.setLineDash(c.off ? [10, 8] : []); ctx.stroke(); ctx.setLineDash([]);

}
function checkEnd() {
  if (!duration) return;

    if (v.ended || v.currentTime >= exportEnd - 0.02) { v.pause(); finishExport(); }

v.onended = () => { checkEnd(); };
v.addEventListener('timeupdate', checkEnd);   // タイマーが間引かれても、再生位置の更新で終了を判定する
function loop() {

}
loop();
setInterval(() => { checkEnd(); if (v.paused) draw(); }, 200);   // 動画が止まるとフレーム通知が来ないため、終了判定は定期処理でも行う

// ---------- 保存 ----------
async function saveBlob(blob, name) {
  const file = new File([blob], name, {type: blob.type});
  // スマホ: 共有シート(「写真に保存」「ファイルに保存」などを選べる)
  if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); return 'saved'; }
    catch (e) { if (e && e.name === 'AbortError') return 'declined'; }
  }
  // PC(Chrome / Edge): 保存先を選ぶ
  if (window.showSaveFilePicker) {
    try {
      const ext = name.split('.').pop();
      const h = await window.showSaveFilePicker({suggestedName: name, types: [{description: 'ファイル', accept: {[blob.type || 'application/octet-stream']: ['.' + ext]}}]});
      const w = await h.createWritable(); await w.write(blob); await w.close(); return 'saved';
    } catch (e) { if (e && e.name === 'AbortError') return 'declined'; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 20000);
  return 'saved';
}
// ---------- 書き出し ----------
const doExport = async () => {
  if (exporting) return;
  const types = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  exporting = true; chunks = []; $('saveVideo').hidden = true;
  ['export', 'play', 'tStart', 'tEnd', 'file', 'pick', 'addBtn'].forEach(i => $(i).disabled = true); $('stop').disabled = false;
  v.pause(); v.onseeked = null;
  exportStart = tS(); exportEnd = tE();      // 書き出しの範囲はトリミングバー(青い範囲)で固定。再生カーソルの位置は使わない
  for (let i = 0; i < 5 && Math.abs(v.currentTime - exportStart) > 0.05; i++) {
    await new Promise(r => { const f = () => r(); v.addEventListener('seeked', f, {once: true}); setTimeout(f, 3000); v.currentTime = exportStart; });
  }
  v.onseeked = onSeeked;
  heads = []; dbg = []; lastDet = -1e9;
  if ($('mosaicOn').checked) await detect();
  const vs = cv.captureStream(30); exportStream = vs;
  v.muted = false; v.volume = 1;
  try { const cs = (v.captureStream || v.mozCaptureStream).call(v); exportCapture = cs; cs.getAudioTracks().forEach(t => vs.addTrack(t)); } catch (e) {}
  recorder = new MediaRecorder(vs, mime ? {mimeType: mime, videoBitsPerSecond: 8e6} : {videoBitsPerSecond: 8e6});
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = async () => {
    const type = recorder.mimeType || mime || 'video/mp4';
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, {type});
    if (!blob.size) { setStatus('書き出した動画が空でした。もう一度お試しください。'); return; }
    const size = (blob.size / 1048576).toFixed(1);
    lastOut = {blob, name: '出力.' + ext, size, ext};
    $('saveVideo').hidden = false;
    setStatus(`書き出し完了(${ext}形式、${size}MB)。下の「保存する」を押してください。`);
  };
  setStatus('書き出し中…');
  try { await v.play(); }
  catch (e) {
    v.muted = true;   // 音声付き再生が拒否された場合は無音で続行
    try { await v.play(); setStatus('書き出し中…(再生が制限されたため、音声なしで書き出します)'); }
    catch (e2) { setStatus('再生を開始できませんでした。もう一度「書き出し」を押してください。'); finishExport(); return; }
  }
  recorder.start(500);   // 再生が実際に始まってから録画を始める(開始前の静止画面が混ざらないように)
  exportPlaying = true;
  const t0 = exportStart, len = exportEnd - exportStart;

};
$('export').onclick = doExport;
// 録画用のストリームを解放する(解放しないと、書き出しを重ねるたびに再生が遅くなる)
function releaseStreams() {
  [exportStream, exportCapture].forEach(st => { try { st && st.getTracks().forEach(t => t.stop()); } catch (e) {} });
  exportStream = null; exportCapture = null;
}
function finishExport() {
  if (!exporting) return;
  exporting = false; exportPlaying = false; v.muted = true;
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  setTimeout(releaseStreams, 800);
  ['export', 'play', 'tStart', 'tEnd', 'file', 'pick', 'addBtn'].forEach(i => $(i).disabled = false); $('stop').disabled = true;
  $('prog').style.width = '100%';
}
$('stop').onclick = () => { v.pause(); finishExport(); };
$('saveVideo').onclick = async () => {
  if (!lastOut) return;
  const res = await saveBlob(lastOut.blob, lastOut.name);
  setStatus(res === 'saved' ? `保存しました(${lastOut.ext}形式、${lastOut.size}MB)。必ず最初から最後まで見て、隠し漏れがないか確認してください。` : '保存をキャンセルしました。もう一度「保存する」を押せます。');
};
updateTrim();

const openSheet = o => { $('sheet').hidden = !o; $('shade').hidden = !o; };
$('settingsBtn').onclick = () => openSheet(true);
$('closeSheet').onclick = () => openSheet(false);

// ---------- プレビューの拡大(ページ全体ではなく、プレビューだけを拡大・移動する) ----------
(function () {
  const stage = document.querySelector('.stage');
  let scale = 1, tx = 0, ty = 0;
  const pts = new Map(); let pinch = null, panOne = null, suppress = false;
  const MAXS = 10;
  const apply = () => { cv.style.transform = scale === 1 ? '' : `translate(${tx}px, ${ty}px) scale(${scale})`; };
  const clamp = () => {
    const sw = stage.clientWidth, sh = stage.clientHeight, cw = cv.offsetWidth * scale, ch = cv.offsetHeight * scale;
    const mx = Math.max(0, (cw - sw) / 2) + 40, my = Math.max(0, (ch - sh) / 2) + 40;   // 画像が画面外へ出てしまわない範囲
    tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty));
  };
  const center = () => { const r = stage.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.top + r.height / 2}; };
  function zoomAt(fx, fy, ns) {
    ns = Math.min(MAXS, Math.max(1, ns));
    const c = center(), k = ns / scale;
    tx = (fx - c.x) - k * (fx - c.x - tx); ty = (fy - c.y) - k * (fy - c.y - ty);
    scale = ns; if (scale === 1) { tx = 0; ty = 0; }
    clamp(); apply();
  }
  window.resetZoom = () => { scale = 1; tx = 0; ty = 0; apply(); };
  const zc = () => center();
  const zi = document.getElementById('zoomIn'), zo = document.getElementById('zoomOut'), zr = document.getElementById('zoomReset');
  if (zi) zi.onclick = () => { const c = zc(); zoomAt(c.x, c.y, scale * 1.6); };
  if (zo) zo.onclick = () => { const c = zc(); zoomAt(c.x, c.y, scale / 1.6); };
  if (zr) zr.onclick = () => window.resetZoom();
  const fileEl = document.getElementById('file');
  if (fileEl) fileEl.addEventListener('change', () => window.resetZoom());

  // 2本指: 拡大・縮小と移動 / 拡大中の1本指: 移動(編集モード中の1本指は、円の操作を優先)
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('.zoomctl')) return;
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size === 2) {
      if (typeof drag !== 'undefined') drag = null;   // 円の移動などは中止
      const [a, b] = [...pts.values()];
      pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2};
      panOne = null;
    } else if (pts.size === 1) {
      const ed = typeof editing !== 'undefined' && editing;
      panOne = (scale > 1 && !ed) ? {x: e.clientX, y: e.clientY, moved: false} : null;
    }
    if (pts.size >= 2) e.stopPropagation();
  }, true);

    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (pts.size >= 2 && pinch) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      tx += mx - pinch.mx; ty += my - pinch.my;
      zoomAt(mx, my, scale * d / (pinch.d || d));

    } else if (panOne && pts.size === 1) {
      const dx = e.clientX - panOne.x, dy = e.clientY - panOne.y;
      if (!panOne.moved && Math.hypot(dx, dy) < 6) return;
      panOne.moved = true; suppress = true;
      tx += dx; ty += dy; panOne.x = e.clientX; panOne.y = e.clientY;

  stage.addEventListener('click', e => { if (suppress) { e.stopPropagation(); e.preventDefault(); suppress = false; } }, true);
  // PC: ホイールで拡大・縮小
  stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); }, {passive: false});
  // iPhone(Safari): ページ全体のピンチ拡大を止める
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
})();
</script>
</body></html>
